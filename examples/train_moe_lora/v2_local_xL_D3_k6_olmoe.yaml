### model
model_name_or_path: allenai/OLMoE-1B-7B-0924
trust_remote_code: true
use_reentrant_gc: false

### method (v2_local_xL D3 — N_global=128, global_rank=8)
# Per-layer 固定: N=16, r=4 (4.19M)
# Cross-layer: N=128, r=8 (128 × 8 = 1024, same)
# Global pool: 128 × 2 × 8 × 2048 = 4.19M
stage: sft
do_train: true
finetuning_type: moe_lora
moe_lora_n_experts: 16
moe_lora_n_global: 128
moe_lora_rank: 4
moe_lora_alpha: 8
moe_lora_global_rank: 8
moe_lora_global_alpha: 16
moe_lora_top_k: 6
moe_lora_pool_share: per_layer
moe_lora_w_share: per_layer
moe_lora_target_layers: all
moe_lora_balance_loss_coef: 0.0
moe_lora_hidden_bottleneck_dim: 32

### dataset
dataset: metamathqa_r1
template: default
cutoff_len: 2048
preprocessing_num_workers: 64
dataloader_num_workers: 4

### output
output_dir: saves/olmoe/moe_lora/v2_local_xL_D3_k6
logging_steps: 5
save_steps: 400
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: wandb
run_name: olmoe_v2_local_xL_D3_k6

### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 8
learning_rate: 4.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_find_unused_parameters: true
