### model
model_name_or_path: allenai/OLMoE-1B-7B-0924
trust_remote_code: true
use_reentrant_gc: false

### method (PERFT-S: Single Dense LoRA on MoE-FFN — math domain, OLMoE)
# Non-MoE form of fine-tuning on MoE base model. Baseline 回应 reviewer 质疑:
# "为什么 MoE-style PEFT 对 MoE 模型有意义?dense LoRA 不行吗?"
#
# 设计: 每层挂 1 个 dense LoRA(no expert routing),通过 moe_lora 框架退化实现:
#   - n_experts=1 + top_k=1: pool 只 1 个 LoRA(routing 退化为永选)
#   - pool_share=per_layer: 每层独立 1 个 LoRA(纯 dense 形态)
#   - 无 W_l projection / inheritance / MoE-style 路由决策
#
# forward: y = MoE_FFN(h) + LoRA_l(h)  ← 单一 dense LoRA 残差,与 base routing 解耦
#
# 参考: PERFT~\citep{liu2024perft} Eq.10 的 "Single shared PEFT expert" 变体
#
# 参数估算(对齐 OLMoE RCP ~8.4M):
#   每层 1 LoRA (rank=128): 2 × 128 × 2048 = 0.52M
#   16 层: 0.52M × 16 = 8.39M ✅
stage: sft
do_train: true
finetuning_type: moe_lora
moe_lora_n_experts: 1              # ⭐ 每层只 1 个 LoRA(no MoE pool)
moe_lora_rank: 128
moe_lora_alpha: 256
moe_lora_top_k: 1                  # 永远选唯一那个 LoRA
moe_lora_pool_share: per_layer     # 每层独立
moe_lora_w_share: per_layer        # routing 退化(只 1 个选择)
moe_lora_target_layers: all
moe_lora_routing_mode: independent # 任何模式都等价(只 1 expert)

### dataset
dataset: metamathqa_r1
template: default
cutoff_len: 2048
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/olmoe/moe_lora/perft_s_math
logging_steps: 5
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: wandb
run_name: olmoe_perft_s_math

### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 8
learning_rate: 4.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_find_unused_parameters: true
