### model
model_name_or_path: allenai/OLMoE-1B-7B-0924
trust_remote_code: true
use_reentrant_gc: false

### method (Ablation: AnchorLoRA WITHOUT global pool — per_layer, param-matched to baseline2)
# 唯一变量: pool_share=per_layer (主配置=global)
# 其余参数对齐 baseline2 (rank=8, top_k=2, N=16/layer) → LoRA pool 8.39M
# 保留 RCP (routing_projection W_l + hidden_bottleneck) — ablation 只去掉 global pool
#
# 参数估算:
#   LoRA pool: 16 layers × 16 × 2 × 8 × 2048 = 8.39M (= baseline2)
#   W_l (per-layer, Linear(64+16, 16)): 16 × 80 × 16 = 0.02M
#   h_proj (per-layer, Linear(2048, 16)): 16 × 2048 × 16 = 0.52M
#   总 trainable ≈ 8.93M (~0.13% of OLMoE 6.9B)
stage: sft
do_train: true
finetuning_type: moe_lora
moe_lora_n_experts: 16                    # ⭐ 每层 16 个独立 expert (与 baseline2 一致)
moe_lora_rank: 8                          # ⭐ 与 baseline2 一致 (主配置是 16)
moe_lora_alpha: 16                        # ⭐ 与 baseline2 一致 (主配置是 32)
moe_lora_top_k: 2                         # ⭐ 与 baseline2 一致 (主配置是 4)
moe_lora_pool_share: per_layer            # ⭐ 关键 ablation 变量
moe_lora_w_share: per_layer
moe_lora_target_layers: all
moe_lora_balance_loss_coef: 0.0001
moe_lora_hidden_bottleneck_dim: 16        # 保留 RCP bottleneck

### dataset
dataset: metamathqa_r1
template: default
cutoff_len: 2048
preprocessing_num_workers: 64
dataloader_num_workers: 4

### output
output_dir: saves/olmoe/moe_lora/ablation_noglobal_r8
logging_steps: 5
save_steps: 400
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: wandb
run_name: ablation_noglobal_r8

### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 8
learning_rate: 4.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_find_unused_parameters: true
