### model
model_name_or_path: allenai/OLMoE-1B-7B-0924
trust_remote_code: true
use_reentrant_gc: false

### method (V2-Enhanced N=128, rank=16, d_b=16, no balance loss)
# Identical to v2_enhanced_olmoe.yaml EXCEPT balance_loss_coef = 0.0
# Matches the "no aux loss" project decision (see CLAUDE.md memory).
stage: sft
do_train: true
finetuning_type: moe_lora
moe_lora_n_experts: 128
moe_lora_rank: 16
moe_lora_alpha: 32
moe_lora_top_k: 4
moe_lora_pool_share: global
moe_lora_w_share: per_layer
moe_lora_target_layers: all
moe_lora_balance_loss_coef: 0.0
moe_lora_hidden_bottleneck_dim: 16

### dataset
dataset: metamathqa_r1
template: default
cutoff_len: 2048
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/olmoe/moe_lora/v2_enhanced_h16_nobal
logging_steps: 5
save_steps: 400
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: wandb
run_name: olmoe_v2_enhanced_h16_nobal

### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 8
learning_rate: 4.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_find_unused_parameters: true
