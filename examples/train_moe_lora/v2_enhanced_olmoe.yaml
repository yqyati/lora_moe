### model
model_name_or_path: allenai/OLMoE-1B-7B-0924
trust_remote_code: true
use_reentrant_gc: false   # reentrant GC + DDP(find_unused_parameters=true) 会让同一参数被 mark ready 两次

### method (V2-Enhanced: routing projection + hidden state bottleneck)
# 突破 V2 的 64-d routing 信息瓶颈:加 16-d token-specific 信号
# 新增参数: 16 layers × Linear(2048→16) ≈ 0.52M
# 总 trainable: 8.52M(原 V2)+ 0.52M(h_proj)+ 微调 W_l ≈ 9.05M = 0.13%
stage: sft
do_train: true
finetuning_type: moe_lora
moe_lora_n_experts: 128
moe_lora_rank: 16
moe_lora_alpha: 32
moe_lora_top_k: 4
moe_lora_pool_share: global
moe_lora_w_share: per_layer
moe_lora_target_layers: all
moe_lora_balance_loss_coef: 0.0001
moe_lora_hidden_bottleneck_dim: 16        # ⭐ 新增:hidden state bottleneck 维度

### dataset
dataset: metamathqa_r1
template: default
cutoff_len: 2048
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/olmoe/moe_lora/v2_enhanced_h16
logging_steps: 5
save_steps: 400
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: wandb
run_name: v2_enhanced_h16

### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 8
learning_rate: 4.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_find_unused_parameters: true
