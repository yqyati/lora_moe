### model
model_name_or_path: allenai/OLMoE-1B-7B-0924
trust_remote_code: true
use_reentrant_gc: false

### method (DAS-LoRA: simplified from "Exploring Expert Concentration" ICLR'26 submission)
# 简化:跳过 Stage 1,直接用预训练 routing 算 DAS,然后挂 LoRA 在 top-k DAS 选出的 expert 上
# 参数量:16 layers × 4 selected experts × 2(A,B) × rank=32 × 2048 = 8.39M ≈ 0.12%(对齐 V2)
# 必须先跑(用本地 JSON,和训练用同一份数据):
#   python eval_scripts/compute_das.py \
#       --base_model allenai/OLMoE-1B-7B-0924 \
#       --domain_dataset data/metamathqa_r1_clean.json \
#       --general_dataset cais/mmlu --general_config all --general_split test \
#       --top_k 4 --max_samples 200 \
#       --output eval_results/das_math.json
stage: sft
do_train: true
finetuning_type: das_lora
das_lora_selected_experts_path: eval_results/das_math.json
das_lora_rank: 32
das_lora_alpha: 64                       # 2 × rank

### dataset
dataset: metamathqa_r1
template: default
cutoff_len: 2048
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/olmoe/moe_lora/das_lora_math
logging_steps: 5
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb
run_name: das_lora_math

### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 8
learning_rate: 4.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_find_unused_parameters: true
