### model
model_name_or_path: allenai/OLMoE-1B-7B-0924
trust_remote_code: true
use_reentrant_gc: false

### method (v2_local_xL — C-3: per-rank-doubled variant)
# Per-layer pool: N=8, rank=8 → 4.19M
# Cross-layer global pool: N=64, rank=16 → 4.19M
# 总 LoRA pool: 8.39M (= baseline v2_enhanced)
# 设计 rationale: per-layer rank 翻倍 (4 → 8) 增强 per-layer 表达力,
# global 维持 N=64 r=16. Per-layer N 减半 (16 → 8) 控制总参数.
stage: sft
do_train: true
finetuning_type: moe_lora
moe_lora_n_experts: 8
moe_lora_n_global: 64
moe_lora_rank: 8
moe_lora_alpha: 16
moe_lora_global_rank: 16
moe_lora_global_alpha: 32
moe_lora_top_k: 4
moe_lora_pool_share: per_layer
moe_lora_w_share: per_layer
moe_lora_target_layers: all
moe_lora_balance_loss_coef: 0.0
moe_lora_hidden_bottleneck_dim: 32

### dataset
dataset: metamathqa_r1
template: default
cutoff_len: 2048
preprocessing_num_workers: 64
dataloader_num_workers: 4

### output
output_dir: saves/olmoe/moe_lora/v2_local_xL_C3
logging_steps: 5
save_steps: 400
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: wandb
run_name: olmoe_v2_local_xL_C3

### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 8
learning_rate: 4.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_find_unused_parameters: true
