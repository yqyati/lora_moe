### model
model_name_or_path: /data/android/yqy/work/lora_moe/model/DeepSeek-V2-Lite
trust_remote_code: true
use_reentrant_gc: false

### method (MoELoRA matched to ~22M for fair comparison)
# Same as baseline2_moelora_math but rank=6 instead of 8 to match
# the ~22M trainable budget of other PEFT methods.
# Estimated params:
#   LoRA pool: 26 × 32 × 2 × 6 × 2048 = 20.45M
#   Independent gate: 26 × 2048 × 32 = 1.70M
#   Total ≈ 22.15M
stage: sft
do_train: true
finetuning_type: moe_lora
moe_lora_n_experts: 32
moe_lora_rank: 6
moe_lora_alpha: 12
moe_lora_top_k: 4
moe_lora_pool_share: per_layer
moe_lora_w_share: per_layer
moe_lora_target_layers: all
moe_lora_routing_mode: independent
moe_lora_balance_loss_coef: 0.0

### dataset
dataset: metamathqa_r1
template: default
cutoff_len: 2048
max_samples: 80000
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/deepseek_v2_lite/moe_lora/baseline2_moelora_match22_math
logging_steps: 5
save_steps: 200
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: wandb
run_name: baseline2_moelora_match22_math

### train
per_device_train_batch_size: 16
gradient_accumulation_steps: 2
learning_rate: 4.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_find_unused_parameters: true

### deepspeed
deepspeed: examples/deepspeed/ds_z3_config.json
