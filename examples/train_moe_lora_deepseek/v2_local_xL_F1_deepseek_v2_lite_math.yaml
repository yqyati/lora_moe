### model
model_name_or_path: /data/android/yqy/work/lora_moe/model/DeepSeek-V2-Lite
trust_remote_code: true
use_reentrant_gc: false

### method (v2_local_xL — DeepSeek-V2-Lite math, variant F1)
# Per-layer fixed: N=32, r=4 (13.6M)
# Cross-layer global: N=64, r=30 (N×r=1920) → ~3.93M
# Total: per-layer + global + W_l + h_proj ≈ 21-22M
stage: sft
do_train: true
finetuning_type: moe_lora
moe_lora_n_experts: 32
moe_lora_n_global: 64
moe_lora_rank: 4
moe_lora_alpha: 8
moe_lora_global_rank: 30
moe_lora_global_alpha: 60
moe_lora_top_k: 8
moe_lora_pool_share: per_layer
moe_lora_w_share: per_layer
moe_lora_target_layers: all
moe_lora_balance_loss_coef: 0.0
moe_lora_hidden_bottleneck_dim: 64

### dataset
dataset: metamathqa_r1
template: default
cutoff_len: 2048
max_samples: 80000
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/deepseek_v2_lite/moe_lora/v2_local_xL_F1
logging_steps: 5
save_steps: 200
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: wandb
run_name: deepseek_v2_lite_v2_local_xL_F1

### train
per_device_train_batch_size: 16
gradient_accumulation_steps: 2
learning_rate: 4.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_find_unused_parameters: true

### deepspeed
deepspeed: examples/deepspeed/ds_z3_config.json
