### model
model_name_or_path: /data/android/yqy/work/lora_moe/model/DeepSeek-V2-Lite
trust_remote_code: true                # ⭐ DeepSeek 用 custom modeling code
use_reentrant_gc: false

### method (RCP-PerLayer — 消融:去掉 Global Shared Pool,改成 per-layer pool)
# Q3 ablation: Global Shared Pool vs Per-layer Pool 对照
#
# 跟 rcp_deepseek_v2_lite_math.yaml(grouped pool 主配置)的唯一区别:
#   pool_share:  global  →  per_layer
#   n_groups:    8       →  1         (per_layer 模式下 n_groups 必须=1)
#   n_experts:   512     →  64        (改成"每层独立 64 个 expert")
#
# 其他完全对齐(W_l 结构 / hidden_bottleneck / top_k / rank / lr / data 等),
# 实现严格的"single-variable" 消融 —— 唯一变量就是参数共享策略。
#
# 结构对齐说明:
#   主配置 (n_groups=8, N_L=512):  W_l 输出维度 = 512/8 = 64
#   本消融 (per_layer, N_L=64):    W_l 输出维度 = 64
#   → 两者 W_l 输入/输出维度严格一致,只是 64 个 expert 在两个配置里"归属"不同:
#     - 主配置: 64 expert 跨 ~3-4 层共享(grouped)
#     - 本消融: 每层有自己独立的 64 expert(no sharing)
#
# 参数估算(per-layer pool, N_L=64 per layer × 26 layers):
#   LoRA pool: 26 × 64 × 2 × 8 × 2048 = 54.53M
#   W_l (per-layer, Linear(64+64, 64)): 26 × 128 × 64 = 0.21M
#   h_proj (per-layer, Linear(2048, 64)): 26 × 2048 × 64 = 3.41M
#   总 trainable ≈ 58.15M (~0.37% of 15.7B)
#
# ⚠️ 注意 param 不对齐:
#   本消融 LoRA pool 参数是主配置(16.78M)的 3.25×
#   → 如果本消融仍输给主配置,等于证明 "global pool 用 1/3 参数得到更好结果",
#     反向支撑 Q3 论点(sharing enhances specialization)
#   → 想严格 param-matched 比较,可把 N_L 改成 20/layer(20×26×32768 ≈ 17M)
stage: sft
do_train: true
finetuning_type: moe_lora
moe_lora_n_experts: 32                  # 每层独立 64 个 expert(no sharing across layers)
moe_lora_rank: 8
moe_lora_alpha: 16
moe_lora_top_k: 4                       # 与主配置对齐
moe_lora_pool_share: per_layer          # ⭐ 关键消融变量:per_layer(不共享)
moe_lora_w_share: per_layer
moe_lora_target_layers: all             # 自动覆盖 26 个 MoE block(layer 0 排除)
moe_lora_hidden_bottleneck_dim: 64

### dataset
dataset: metamathqa_r1
template: default
cutoff_len: 2048
max_samples: 80000
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/deepseek_v2_lite/moe_lora/rcp_perlayer_math
logging_steps: 5
save_steps: 200
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: wandb
run_name: deepseek_v2_lite_rcp_perlayer_math

### train
per_device_train_batch_size: 16
gradient_accumulation_steps: 2
learning_rate: 4.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_find_unused_parameters: true

### deepspeed
deepspeed: examples/deepspeed/ds_z3_config.json
