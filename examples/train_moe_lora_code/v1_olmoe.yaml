### model
model_name_or_path: allenai/OLMoE-1B-7B-0924
trust_remote_code: true
use_reentrant_gc: false

### method (V1: 每层独享池 16 expert × rank=8)
stage: sft
do_train: true
finetuning_type: moe_lora
moe_lora_n_experts: 16
moe_lora_rank: 8
moe_lora_alpha: 16
moe_lora_top_k: 4
moe_lora_pool_share: per_layer
moe_lora_w_share: per_layer
moe_lora_target_layers: all
moe_lora_balance_loss_coef: 0.0001

### dataset
dataset: magicoder_oss_75k
template: default
cutoff_len: 2048
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/olmoe/moe_lora_code/v1_per_layer
logging_steps: 5
save_steps: 200
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: wandb
run_name: code_v1_per_layer

### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 2
learning_rate: 2.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_find_unused_parameters: true
