### model
model_name_or_path: allenai/OLMoE-1B-7B-0924
trust_remote_code: true
use_reentrant_gc: false

### method (VBase: 每层 64 expert × rank=2，路由直接复用 OLMoE 原 router)
stage: sft
do_train: true
finetuning_type: moe_lora
moe_lora_n_experts: 64
moe_lora_rank: 2
moe_lora_alpha: 4
moe_lora_top_k: 8
moe_lora_pool_share: per_layer
moe_lora_w_share: per_layer
moe_lora_routing_mode: follow_moe
moe_lora_target_layers: all

### dataset
dataset: magicoder_oss_75k
template: default
cutoff_len: 2048
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/olmoe/moe_lora_code/vbase_follow_moe
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb
run_name: code_vbase_follow_moe

### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 8
learning_rate: 4.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_find_unused_parameters: true
