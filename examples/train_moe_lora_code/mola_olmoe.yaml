### model
model_name_or_path: allenai/OLMoE-1B-7B-0924
trust_remote_code: true
use_reentrant_gc: false

### method (MoLA NAACL 2024: per-layer expert allocation, independent routing)
# 16 layers,递增分配:[8,8,8,8, 12,12,12,12, 20,20,20,20, 24,24,24,24],总和 256
# 参数量 = 256 × 2(A,B) × 8 × 2048 = 8.39M ≈ 0.12%(对齐 V2 / baseline2)
stage: sft
do_train: true
finetuning_type: mola
mola_n_experts_per_layer: "8,8,8,8,12,12,12,12,20,20,20,20,24,24,24,24"
mola_rank: 8
mola_alpha: 16
mola_top_k: 2

### dataset
dataset: magicoder_oss_75k
template: default
cutoff_len: 2048
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/olmoe/moe_lora_code/mola_code
logging_steps: 5
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: wandb
run_name: mola_code

### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 2
learning_rate: 2.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_find_unused_parameters: true
