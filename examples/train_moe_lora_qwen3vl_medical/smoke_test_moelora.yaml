### model
model_name_or_path: /data/android/yqy/work/lora_moe/model/Qwen3.5-35B-A3B
trust_remote_code: true
use_reentrant_gc: false
image_max_pixels: 262144
video_max_pixels: 16384

### method (smoke test of baseline2 MoELoRA — 跟正式 yaml 完全一致的方法配置)
stage: sft
do_train: true
finetuning_type: moe_lora
moe_lora_n_experts: 64
moe_lora_rank: 8
moe_lora_alpha: 16
moe_lora_top_k: 8
moe_lora_pool_share: per_layer
moe_lora_w_share: per_layer
moe_lora_target_layers: all
moe_lora_routing_mode: independent

### dataset (smoke: 只取 20 条)
dataset: llava_med_60k
template: qwen3_5_nothink
cutoff_len: 2048
max_samples: 20
preprocessing_num_workers: 4
dataloader_num_workers: 0                 # 避免 worker 进程在 smoke 期间出问题

### output
output_dir: saves/qwen3vl/moe_lora/smoke_test_moelora
logging_steps: 1
save_steps: 100000                        # 不在 smoke 期间存
plot_loss: false
overwrite_output_dir: true
save_only_model: true
report_to: none                           # smoke 不上 wandb

### train (只跑 3 步)
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 6.0e-4
max_steps: 3
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_find_unused_parameters: true

### deepspeed
deepspeed: examples/deepspeed/ds_z3_config.json
