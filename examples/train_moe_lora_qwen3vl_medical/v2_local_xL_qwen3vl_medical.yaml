### model
model_name_or_path: /data/android/yqy/work/lora_moe/model/Qwen3.5-35B-A3B
trust_remote_code: true
use_reentrant_gc: false
image_max_pixels: 262144
video_max_pixels: 16384

### method (V2-Enhanced PerLayer routed + Cross-layer Global Pool, Qwen3.5-VL medical)
# 设计:
#   - per-layer routed pool (N_local=56, 每层独立, rank=8)
#   - cross-layer global pool (N_global=160, 所有层共享, rank=16) -- rank 比 per-layer 大 2x
#   - per-layer W_l 输出 (N_local + N_global) = 216 维 logits
#   - Joint top-K=8: per-layer 和 cross-layer expert 在 logits 空间统一竞争
#   - Joint 模式不算 balance loss
#   - W_l 用 anchor init (block-identity on z-channel, zero on h-channel) 让训练初期
#     routing 接近 base MoE routing,逐步学习偏离
#
# 设计 rationale: cross-layer expert 要 serve 多个 layer, 给它更大的 rank (16) 增强表达力;
# per-layer expert 服务单层的局部 specialization, rank=8 已足够.
#
# 参数估算 (40 layers, d_model=2048):
#   Per-layer pool: 40 × 56 × 2 × 8 × 2048 = 73.40M
#   Cross-layer pool: 1 × 160 × 2 × 16 × 2048 = 10.49M
#   W_l per layer (proj_in=128+256=384, proj_out=56+160=216): 40 × 384 × 216 = 3.32M
#   h_proj per layer (hidden_bottleneck=256): 40 × 2048 × 256 = 20.97M
#   总 trainable ≈ 108M (~0.31% of 35B, ≈ baseline perlayer 106M)
stage: sft
do_train: true
finetuning_type: moe_lora
moe_lora_n_experts: 56                    # N_local: per-layer pool size (baseline 64, 略减给 cross-layer)
moe_lora_n_global: 160                    # ⭐ N_global: cross-layer pool size
moe_lora_rank: 8                          # per-layer pool rank
moe_lora_alpha: 16                        # per-layer pool alpha (scale = 2.0)
moe_lora_global_rank: 16                  # ⭐ cross-layer pool rank (per-layer 的 2x)
moe_lora_global_alpha: 32                 # ⭐ cross-layer pool alpha (scale = 2.0)
moe_lora_top_k: 8                         # joint top-K
moe_lora_pool_share: per_layer
moe_lora_w_share: per_layer
moe_lora_target_layers: all
moe_lora_balance_loss_coef: 0.0           # joint 模式 dispatch 跳过 balance loss
moe_lora_hidden_bottleneck_dim: 256
moe_lora_wl_init: anchor

### dataset
dataset: medical_mixed
template: qwen3_5_nothink
cutoff_len: 2048
max_samples: 80000
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/qwen3vl/moe_lora/v2_local_xL_medical_mixed
logging_steps: 5
save_steps: 200
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: wandb
run_name: qwen3vl_v2_local_xL_medical_mixed

### train
per_device_train_batch_size: 8            # 加倍 (bs=4 时 GPU 内存 25/80GB,翻倍后约 51GB 仍安全)
gradient_accumulation_steps: 4            # effective batch = 8 × 4 × 8 = 256 (vs 之前 128),总 step 减半到 ~290
learning_rate: 2.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_find_unused_parameters: true

### deepspeed
deepspeed: examples/deepspeed/ds_z3_config.json
