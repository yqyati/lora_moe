### model
model_name_or_path: /data/android/yqy/work/lora_moe/model/Qwen3.5-35B-A3B
trust_remote_code: true
use_reentrant_gc: false
image_max_pixels: 262144                  # 512x512,医学图细节足够
video_max_pixels: 16384                   # LLaVA-Med 是 image-only,占位

### method (baseline2: MoELoRA — per_layer pool + 独立 router)
# 标准 MoELoRA 结构:每层独立 LoRA pool + 独立 router(从 hidden state 学)
# Qwen3.5-VL text decoder 40 层 (N_E=256, hidden=2048)
# 参数:40 × n_experts × 2(A,B) × rank × hidden + 独立 router(40 × hidden × n_exp)
# rank=8, n_experts=64 → 40 × 64 × 2 × 8 × 2048 = 83.89M + router 5.24M ≈ 89.13M (~0.255%)
# (N_L:N_E = 1:4,对齐 OLMoE 的 ratio;承认 MoE base 大 N_E 需要更细粒度 LoRA routing)
stage: sft
do_train: true
finetuning_type: moe_lora
moe_lora_n_experts: 64
moe_lora_rank: 8
moe_lora_alpha: 16                        # 2 × rank
moe_lora_top_k: 8                         # 跟 base routed top-k=8 / v2_enhanced_perlayer / DAS 对齐 active ratio (1:8)
moe_lora_pool_share: per_layer
moe_lora_w_share: per_layer               # independent 模式下被忽略
moe_lora_target_layers: all
moe_lora_routing_mode: independent        # MoELoRA-style 独立 router

### dataset
dataset: medical_mixed
template: qwen3_5_nothink
cutoff_len: 2048
max_samples: 80000                        # mixed 总 74k,全用
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/qwen3vl/moe_lora/baseline2_moelora_medical_mixed
logging_steps: 5
save_steps: 200
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: wandb
run_name: qwen3vl_baseline2_moelora_medical_mixed

### train
per_device_train_batch_size: 4            # mixed 数据含长描述,保守 per_device
gradient_accumulation_steps: 4            # effective batch ~ 128 (8 GPU × 4 × 4)
learning_rate: 2.0e-4                     # 跟 v2/das_lora 对齐
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_find_unused_parameters: true

### deepspeed
deepspeed: examples/deepspeed/ds_z3_config.json
