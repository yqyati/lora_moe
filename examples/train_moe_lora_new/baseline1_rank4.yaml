### model
model_name_or_path: allenai/OLMoE-1B-7B-0924
trust_remote_code: true
use_reentrant_gc: false

### method (Baseline1 capacity sweep on math: rank=4,2× of main vbase — 16.8M / 0.24%)
# follow_moe 模式:每个 OLMoE expert 挂一份 LoRA,n_experts 必须 = 64
# 参数量:16 layers × 64 experts × 2(A,B) × rank=4 × 2048 = 16.78M
stage: sft
do_train: true
finetuning_type: moe_lora
moe_lora_n_experts: 64                  # 必须等于 OLMoE 的 num_experts (64)
moe_lora_rank: 4
moe_lora_alpha: 8                        # 2 × rank
moe_lora_top_k: 8                        # = OLMoE 的 num_experts_per_tok
moe_lora_pool_share: per_layer
moe_lora_w_share: per_layer              # follow_moe 模式下被忽略
moe_lora_routing_mode: follow_moe        # ⭐ 跳过 RoutingProjection
moe_lora_target_layers: all

### dataset
dataset: metamathqa_r1
template: default
cutoff_len: 2048
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/olmoe/moe_lora_new/baseline1_rank4
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb
run_name: math_baseline1_rank4

### train
per_device_train_batch_size: 16
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_find_unused_parameters: true
