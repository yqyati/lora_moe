### model
model_name_or_path: allenai/OLMoE-1B-7B-0924
trust_remote_code: true
use_reentrant_gc: false

### method (V2 capacity sweep on math: rank=128,8× of main V2 — 67.2M / ~0.96% ≈ 1%)
# 参数量:16 layers (W_l) + 128 experts × 2(A,B) × rank=128 × 2048 = 67.24M
# 注意:跨过 PEFT efficient framing 的 0.5% 红线,论文里需要明确 frame 为
#       "performance-oriented variant",和 0.12% / 0.24% / 0.48% 形成 4 点曲线
stage: sft
do_train: true
finetuning_type: moe_lora
moe_lora_n_experts: 128
moe_lora_rank: 128
moe_lora_alpha: 256                      # 2 × rank
moe_lora_top_k: 4
moe_lora_pool_share: global
moe_lora_w_share: per_layer
moe_lora_target_layers: all
moe_lora_balance_loss_coef: 0.0001

### dataset
dataset: metamathqa_r1
template: default
cutoff_len: 2048
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/olmoe/moe_lora_new/v2_rank128
logging_steps: 5
save_steps: 400
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: wandb
run_name: math_v2_rank128

### train
# rank=128 比 rank=64 大一倍,把 per-device batch 减半,grad_accum 翻倍,保持有效 batch=64/node
per_device_train_batch_size: 4
gradient_accumulation_steps: 16
learning_rate: 2.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_find_unused_parameters: true
