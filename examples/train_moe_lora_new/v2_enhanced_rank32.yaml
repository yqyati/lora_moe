### model
model_name_or_path: allenai/OLMoE-1B-7B-0924
trust_remote_code: true
use_reentrant_gc: false

### method (V2-Enhanced capacity sweep: rank=32 + hidden bottleneck h=16)
# vs v2_rank32 (V2 sweep): 多了 hidden state bottleneck (h_proj 16d)
# 参数量: 128 experts × 2(A,B) × rank=32 × 2048 = 16.78M (LoRA pool)
#        + 16 layers × Linear(64+16, 128) ≈ 0.16M (W_l)
#        + 16 layers × Linear(2048, 16) = 0.52M (h_proj)
#        ≈ 17.46M ≈ 0.252%
stage: sft
do_train: true
finetuning_type: moe_lora
moe_lora_n_experts: 128
moe_lora_rank: 32
moe_lora_alpha: 64                       # 2 × rank
moe_lora_top_k: 4
moe_lora_pool_share: global
moe_lora_w_share: per_layer
moe_lora_target_layers: all
moe_lora_balance_loss_coef: 0.0001
moe_lora_hidden_bottleneck_dim: 16        # ⭐ V2-Enhanced

### dataset
dataset: metamathqa_r1
template: default
cutoff_len: 2048
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/olmoe/moe_lora_new/v2_enhanced_rank32
logging_steps: 5
save_steps: 400
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb
run_name: math_v2_enhanced_rank32

### train
per_device_train_batch_size: 16
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_find_unused_parameters: true
