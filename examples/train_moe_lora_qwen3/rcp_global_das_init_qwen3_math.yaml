### model
model_name_or_path: /data/android/yqy/work/lora_moe/model/Qwen3-30B-A3B
trust_remote_code: true
use_reentrant_gc: false

### method (RCP + Hierarchical Pool + DAS Init) — math domain
# Hierarchical Pool: 48 层分 4 组,每组 12 层共享 1 个 pool × 128 LoRA expert。
# DAS init: 每层 W_l (输出维度=128=n_lora_per_group) 用对应层 DAS 排序 base expert,
# 实现 1-to-1 精准映射(每个 LoRA expert 强响应 DAS 排名对应的那个 base expert)。
#
# 参数估算:
#   LoRA pool (4 groups × 128 LoRAs/group): 4 × 128 × 2 × 16 × 2048 = 33.55M
#   W_l (per-layer): 48 × 160 × 128 = 0.98M (input dim = 128 + 32)
#   h_proj (per-layer): 48 × 2048 × 32 = 3.15M
#   总 trainable ≈ 37.68M (与原 RCP code hierarchical 完全对齐)
stage: sft
do_train: true
finetuning_type: moe_lora
moe_lora_n_experts: 512
moe_lora_n_groups: 4              # ⭐ Hierarchical Pool: 4 组 × 128 LoRA/组
moe_lora_rank: 16
moe_lora_alpha: 32
moe_lora_top_k: 4
moe_lora_pool_share: global
moe_lora_w_share: per_layer
moe_lora_target_layers: all
#moe_lora_balance_loss_coef: 0.0001
moe_lora_hidden_bottleneck_dim: 32

### ⭐ DAS-informed initialization (math domain DAS, 1-to-1 alignment)
moe_lora_das_init_path: eval_results/das_qwen3_math.json
moe_lora_das_init_strength: 1.0

### dataset
dataset: metamathqa_r1
template: qwen3
cutoff_len: 2048
max_samples: 80000
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/qwen3/moe_lora/rcp_h16_das_init_math
logging_steps: 5
save_steps: 100
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: wandb
run_name: qwen3_rcp_h16_das_init_math

### train
# 8× H800 (80GB each, 640GB total)
# Effective batch: per_device 12 × grad_accum 3 × 8 卡 = 288
per_device_train_batch_size: 12
gradient_accumulation_steps: 3
learning_rate: 6.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_find_unused_parameters: true

### deepspeed
deepspeed: examples/deepspeed/ds_z3_config.json
