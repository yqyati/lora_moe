### model
model_name_or_path: /data/android/yqy/work/lora_moe/model/Qwen3-30B-A3B
trust_remote_code: true
use_reentrant_gc: false

### method (RCP w/ per-layer pool — code domain) — ablation A2
# 对照实验: 把原 RCP 的 hierarchical global pool 改成 per-layer isolated pool,
# 每层独立 N_L=12 LoRA expert (没有跨层共享),参数预算与默认 RCP 对齐。
#
# Qwen3-30B-A3B: 48 层, N_E=128, top-8 routing, hidden=2048
# 参数估算:
#   LoRA pool (per-layer × 48 层 × 12 LoRA): 48 × 12 × 2 × 16 × 2048 = 37.75M
#   W_l (per-layer): 48 × 144 × 12 ≈ 0.083M (input dim = 128 + 16 = 144)
#   h_proj (per-layer): 48 × 2048 × 16 = 1.57M
#   总 trainable ≈ 39.4M (与原 RCP 38.67M 几乎一致)
#
# 注意: per-layer 模式下 n_groups 字段被忽略,每层独立一份 pool。
# 与原 RCP 的核心区别 = global vs per_layer,其它参数尽量保持一致。
stage: sft
do_train: true
finetuning_type: moe_lora
moe_lora_n_experts: 16             # 每层独立的 LoRA expert 数(原 RCP 是 512 共享)
moe_lora_rank: 6
moe_lora_alpha: 12
moe_lora_top_k: 2
moe_lora_pool_share: per_layer     # ⭐ 关键差异:每层独立 pool,不再 global 共享
moe_lora_w_share: per_layer
moe_lora_target_layers: all
moe_lora_balance_loss_coef:  0.001
moe_lora_hidden_bottleneck_dim: 32 # 略调小避免 W_l 输入维度过大

### dataset
dataset: magicoder_oss_75k
template: qwen3
cutoff_len: 2048
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/qwen3/moe_lora_code/rcp_per_layer
logging_steps: 5
save_steps: 100
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: wandb
run_name: qwen3_rcp_per_layer_code

### train
# 8× H800 — effective batch = 12 × 3 × 8 = 288
per_device_train_batch_size: 12
gradient_accumulation_steps: 3
learning_rate: 6.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_find_unused_parameters: true

### deepspeed
deepspeed: examples/deepspeed/ds_z3_config.json
