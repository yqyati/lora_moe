### model
model_name_or_path: /data/android/yqy/work/lora_moe/model/Qwen3-30B-A3B
trust_remote_code: true
use_reentrant_gc: false

### method (Standard LoRA on attention q/v — Hu et al. 2021)
# Qwen3-30B-A3B: 48 层, hidden=2048, GQA(q→4096, v→512)
# 目标对齐 RCP ~40M trainable (0.13% of 30B)
# rank=96: 48 × ((2048+4096) + (2048+512)) × 96 = 48 × 8704 × 96 = 40.10M ✅
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 96
lora_alpha: 192
lora_dropout: 0.0
lora_target: q_proj,v_proj

### dataset
dataset: metamathqa_r1
template: qwen3
cutoff_len: 2048
max_samples: 80000
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/qwen3/moe_lora/stdlora_math
logging_steps: 5
save_steps: 100
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: wandb
run_name: qwen3_stdlora_math

### train
per_device_train_batch_size: 12
gradient_accumulation_steps: 3
learning_rate: 3.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true

### deepspeed
deepspeed: examples/deepspeed/ds_z3_config.json
