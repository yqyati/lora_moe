### model
model_name_or_path: /data/android/yqy/work/lora_moe/model/Qwen3-30B-A3B
trust_remote_code: true
use_reentrant_gc: false

### method (baseline1: follow_moe — 路由直接复用 Qwen3 原 router)
# Qwen3 N_E=128, 48 层。每个 MoE expert 挂一份 LoRA(n_lora 必须 = 128)
# 参数:48 × 128 × 2(A,B) × rank × 2048
# rank=2 → 50.33M / 30B = 0.168%
# 注:follow_moe 模式受 N_E 约束,无法精确对齐 RCP 40M。50M 是该 baseline 在
# Qwen3 上的最低实用配置(rank=1 表达力过低),caption 中明示约束。
stage: sft
do_train: true
finetuning_type: moe_lora
moe_lora_n_experts: 128                  # 必须 = Qwen3 num_experts
moe_lora_rank: 2
moe_lora_alpha: 4                         # 2 × rank
moe_lora_top_k: 8                         # = Qwen3 num_experts_per_tok
moe_lora_pool_share: per_layer
moe_lora_w_share: per_layer
moe_lora_routing_mode: follow_moe         # 跳过 RoutingProjection
moe_lora_target_layers: all

### dataset
dataset: magicoder_oss_75k
template: qwen3
cutoff_len: 2048
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/qwen3/moe_lora_code/baseline1_follow_moe
logging_steps: 5
save_steps: 100
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb
run_name: qwen3_baseline1_code

### train
per_device_train_batch_size: 12
gradient_accumulation_steps: 3
learning_rate: 6.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_find_unused_parameters: true

### deepspeed
deepspeed: examples/deepspeed/ds_z3_config.json
