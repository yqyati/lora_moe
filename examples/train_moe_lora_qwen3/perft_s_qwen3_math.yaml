### model
model_name_or_path: /data/android/yqy/work/lora_moe/model/Qwen3-30B-A3B
trust_remote_code: true
use_reentrant_gc: false

### method (PERFT-S: Single Dense LoRA on MoE-FFN — math domain)
# Non-MoE form of fine-tuning on MoE base model. 用作 baseline 回应 reviewer 质疑:
# "为什么 MoE-style PEFT(MoELoRA/MoLA)对 MoE 模型有意义?dense LoRA 不行吗?"
#
# 设计: 每层挂 1 个 dense LoRA(no expert routing, no pool),
# 通过 moe_lora 框架的退化配置实现:
#   - n_experts=1 + top_k=1: pool 只 1 个 LoRA,routing 退化(永远选它)
#   - pool_share=per_layer: 每层独立 1 个 LoRA(纯 dense LoRA 形态)
#   - 没有 MoE-style 路由决策,无 W_l projection,无 inheritance
#
# forward: y = MoE_FFN(h) + LoRA_l(h)  ← 单一 dense LoRA 残差,跟 base routing 解耦
#
# 参考: PERFT~\citep{liu2024perft} Eq.10 的 "Single shared PEFT expert" 变体
#
# 参数估算:
#   每层 1 LoRA (rank=200): 2 × 200 × 2048 = 0.82M
#   48 层: 0.82M × 48 = 39.32M ✅ 对齐 RCP ~40M
stage: sft
do_train: true
finetuning_type: moe_lora
moe_lora_n_experts: 1              # ⭐ 每层只 1 个 LoRA(no MoE pool)
moe_lora_rank: 200
moe_lora_alpha: 400
moe_lora_top_k: 1                  # 永远选唯一那个 LoRA
moe_lora_pool_share: per_layer     # 每层独立
moe_lora_w_share: per_layer        # routing 退化(只有 1 个选择)
moe_lora_target_layers: all
moe_lora_routing_mode: independent # 用任何模式都等价(只 1 expert)

### dataset
dataset: metamathqa_r1
template: qwen3
cutoff_len: 2048
max_samples: 80000
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/qwen3/moe_lora/perft_s_math
logging_steps: 5
save_steps: 100
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: wandb
run_name: qwen3_perft_s_math

### train
per_device_train_batch_size: 12
gradient_accumulation_steps: 3
learning_rate: 6.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_find_unused_parameters: true

### deepspeed
deepspeed: examples/deepspeed/ds_z3_config.json
