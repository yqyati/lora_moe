### model (real path for actual training)
model_name_or_path: /data/android/yqy/work/lora_moe/model/DeepSeek-V2-Lite
trust_remote_code: true
use_reentrant_gc: false

### method (user's preferred config: N=256, r=16, K=4, d_b=64)
stage: sft
do_train: true
finetuning_type: moe_lora
moe_lora_n_experts: 256
moe_lora_rank: 16
moe_lora_alpha: 32
moe_lora_top_k: 4
moe_lora_pool_share: global
moe_lora_w_share: per_layer
moe_lora_target_layers: all
moe_lora_balance_loss_coef: 0.0
moe_lora_hidden_bottleneck_dim: 64

### dataset
dataset: magicoder_oss_75k
template: default
cutoff_len: 2048
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/deepseek_v2_lite/moe_lora_code/moe2_deepseek_code_n256r16
logging_steps: 5
save_steps: 100
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: wandb
run_name: moe2_deepseek_code_n256r16

### train
per_device_train_batch_size: 16
gradient_accumulation_steps: 2
learning_rate: 4.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_find_unused_parameters: true

### deepspeed
deepspeed: examples/deepspeed/ds_z3_config.json
